
services:
  app:
    build: .
    container_name: barbercom-app
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-false}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-false}
      BARBERCOM_MAIL_FROM: ${BARBERCOM_MAIL_FROM:-no-reply@barber.com}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BARBERCOM_SMS_SENDER: ${BARBERCOM_SMS_SENDER:-BarberCom}
      BARBERCOM_PRODUCT_IMAGE_DIRECTORY: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - product-uploads:/app/uploads

  mailpit:
    image: axllent/mailpit:latest
    container_name: barbercom-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: mysql:8.4
    container_name: barbercom-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - barbercom-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  barbercom-data:
  product-uploads:
