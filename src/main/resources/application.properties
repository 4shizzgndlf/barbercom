spring.application.name=barbercom
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/barbercomdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:barberuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:barberpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
logging.level.org.springframework.security=DEBUG

# Dashboardet skal kunne modtage produktbilleder i almindelig god kvalitet.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Local mail server used by Docker Compose. Open http://localhost:8025 to view sent emails.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
barbercom.mail.from=${BARBERCOM_MAIL_FROM:no-reply@barber.com}

# Brevo transactional SMS. Leave the API key empty to disable SMS locally.
barbercom.sms.brevo-api-key=${BREVO_API_KEY:}
barbercom.sms.sender=${BARBERCOM_SMS_SENDER:BarberCom}
